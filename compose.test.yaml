name: dms-test

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dms_test
      POSTGRES_USER: dms_test
      POSTGRES_PASSWORD: dms_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms_test -d dms_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
