name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: dms_test
          POSTGRES_USER: dms_test
          POSTGRES_PASSWORD: dms_test
        options: >-
          --health-cmd "pg_isready -U dms_test -d dms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      BETTER_AUTH_SECRET: dms-e2e-test-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3100
      DATABASE_URL: postgresql://dms_test:dms_test@localhost:5432/dms_test
      DEMO_AUTH_EMAIL: demo-admin@dms.invalid
      DEMO_AUTH_PASSWORD: dms-e2e-test-password
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      PLAYWRIGHT_BASE_URL: http://localhost:3100
      TEST_DATABASE_URL: postgresql://dms_test:dms_test@localhost:5432/dms_test

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.3

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate:integration
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
